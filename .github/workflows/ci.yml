name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a second push while the first is still going wastes a
# runner on a commit nobody is waiting for any more, and on a matrix this
# wide that is several.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # From uv.lock, exactly: an unpinned `pip install ruff` let a new ruff
      # release turn unrelated pull requests red. --locked fails if the lock
      # no longer matches pyproject.toml. Installing the project itself is
      # what tests the packaging.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        # The suite stubs the network, so CI never calls the Wikimedia API.
        run: uv run pytest -q --cov --cov-fail-under=90

      - name: Build
        run: uv build
