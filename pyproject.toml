[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nz-attraction-pageviews"
version = "0.1.0"
description = "Incremental API ingest of Wikipedia pageviews for NZ visitor attractions"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17"]

# Named explicitly rather than left to auto-discovery. When the package was a
# directory called `src`, setuptools read it as a src-layout root and built a
# wheel that installed client.py, ingest.py and quality.py at the top level of
# site-packages, where `import client` would collide with anyone else's.
[tool.setuptools]
packages = ["nz_attraction_pageviews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in Wikimedia network smoke test"]
# Put the project root on sys.path so `pytest` works, not just `python -m pytest`
# (the -m form adds the working directory for you; the bare command does not).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
